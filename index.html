        @import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;0,900;1,300;1,400&display=swap');

        input[type="file"] { display: none; }
        .suggestions-list { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid #ddd; border-radius: 4px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); z-index: 1000; max-height: 300px; overflow-y: auto; }
        .suggestion-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #f0f0f0; font-size: 12px; }
        .suggestion-item:hover { background-color: #f3f4f6; }
        .suggestion-price { color: #0284c7; font-weight: bold; float: right; }
        
        /* Ẩn thanh cuộn dọc nhưng vẫn cuộn được cho bảng tính */
        .hide-scrollbar::-webkit-scrollbar { height: 6px; width: 6px;}
        .hide-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .hide-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .hide-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        @media print {
            body { background-color: white; margin: 0; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .no-print, .ui-control, .fixed-toolbar, .modal-overlay, .toast-noti, .suggestions-list, .delete-col { display: none !important; }
            .hide-scrollbar { overflow-x: visible !important; }
            .print-table { min-width: 100% !important; }
            table { page-break-inside: auto; border-collapse: collapse; width: 100%; }
            tr { page-break-inside: avoid; page-break-after: auto; }
            thead { display: table-header-group; }
            tfoot { display: table-footer-group; }
            .bg-sky-600 { background-color: #0284c7 !important; color: white !important; }
            .bg-sky-100 { background-color: #e0f2fe !important; }
        }
    </style>

        const Icons = {

            Edit: ({size=16}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
            Eye: ({size=16}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8-11-8-11-8-11-8-11-8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>,
            Settings: ({size=16}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
            Download: ({size=16}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>,
            FolderOpen: ({size=16}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>,
            FileSpreadsheet: ({size=16}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h2"/><path d="M8 17h2"/><path d="M14 13h2"/><path d="M14 17h2"/></svg>,
            History: ({size=16}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
        };

        // --- LOCAL DATABASE HELPER ---
        const DB_KEY = "AQARA_LOCAL_PRODUCTS";
        const localDbHelper = {
            getProducts: () => {
                try {
                    const data = localStorage.getItem(DB_KEY);
                    return data ? JSON.parse(data) : [];
                } catch (e) {
                    return [];
                }
            },
            saveProducts: (products) => {
                try {
                    const validProducts = products.filter(p => p && String(p.TenSP || "").trim() !== "");
                    localStorage.setItem(DB_KEY, JSON.stringify(validProducts));
                    return true;
                } catch (e) {
                    alert("Không thể lưu dữ liệu. Có thể bộ nhớ trình duyệt đã đầy!");
                    return false;
                }
            }
        };

        // --- BỘ TỪ ĐIỂN ĐA NGÔN NGỮ ---
        const i18n = {
            vi: {
                email: "Email:", contact: "Liên hệ:", hotline: "Hotline:",
                quoteDate: "Ngày báo giá:", customer: "Khách hàng:", address: "Địa chỉ:",
                company: "Công ty:", phone: "SĐT:", mst: "MST:",
                stt: "STT", image: "Hình ảnh", desc: "Tên thiết bị / Mô tả tính năng",
                brand: "Hãng", warranty: "BH(T)", qty: "SL", unit: "ĐVT",
                price: "Đơn giá", discountedPrice: "Đơn giá sau CK", total: "Thành tiền", delete: "Xóa",
                subtotal: "Tổng giá trị:", discount: "Chiết khấu:", amountType: "Số tiền", percentType: "%",
                afterDiscount: "Giá sau chiết khấu:", installFee: "Phí lắp đặt:",
                grandTotal: "Tổng Thanh Toán", currency: "VNĐ", currencyShort: "đ",
                addCategory: "Thêm Hạng Mục (Nhóm) Mới",
                hideHeaderMsg: "Đang ẩn Header (Logo, Tên công ty) khi IN.",
                hideCustomerMsg: "Đang ẩn Thông tin Khách hàng khi IN.",
                hideGreetingMsg: "Đang ẩn Lời chào khi IN.",
                hideTotalMsg: "Đang ẩn Tổng Tiền khi IN.",
                hidePaymentMsg: "Đang ẩn (Tích vào ô vuông để hiện khi in)",
                showPriceCheck: "Hiển thị cột Đơn giá & Thành tiền",
                showDiscountedPriceCheck: "Cột Đơn giá sau CK (Đối soát)",
                hideDiscountedOnPrintCheck: "Ẩn cột Giá sau CK khi Xem/In",
                uploadLogo: "Tải Logo", changeImage: "Đổi ảnh", uploadImage: "Tải ảnh"
            },
            en: {
                email: "Email:", contact: "Website:", hotline: "Hotline:",
                quoteDate: "Date:", customer: "Customer:", address: "Address:",
                company: "Company:", phone: "Phone:", mst: "Tax ID:",
                stt: "No.", image: "Image", desc: "Item / Description",
                brand: "Brand", warranty: "Wty(M)", qty: "Qty", unit: "Unit",
                price: "Unit Price", discountedPrice: "Net Unit Price", total: "Amount", delete: "Del",
                subtotal: "Subtotal:", discount: "Discount:", amountType: "Amount", percentType: "%",
                afterDiscount: "After Discount:", installFee: "Installation:",
                grandTotal: "Grand Total", currency: "USD", currencyShort: "$",
                addCategory: "Add New Category",
                hideHeaderMsg: "Header hidden during print.",
                hideCustomerMsg: "Customer info hidden during print.",
                hideGreetingMsg: "Greeting hidden during print.",
                hideTotalMsg: "Totals hidden during print.",
                hidePaymentMsg: "Hidden during print (Check to show)",
                showPriceCheck: "Show Unit Price & Amount columns",
                showDiscountedPriceCheck: "Net Unit Price Column (Reconcile)",
                hideDiscountedOnPrintCheck: "Hide Net Price on Print",
                uploadLogo: "Upload Logo", changeImage: "Change", uploadImage: "Upload"
            }
        };

        // --- COMPONENTS ---
        const SmartTextarea = ({ value, onChange, className, style, placeholder }) => {
            const ref = useRef(null);
            useEffect(() => { if (ref.current) { ref.current.style.height = 'auto'; ref.current.style.height = ref.current.scrollHeight + 'px'; } }, [value]);
            return <textarea ref={ref} value={value} onChange={onChange} className={className} style={{...style, height: 'auto', minHeight: '1.5em'}} placeholder={placeholder} rows={1} />;
        };

        // QUẢN LÝ SẢN PHẨM LOCAL
        const ProductManager = ({ isOpen, onClose, dbProducts, onReload }) => {
            const [editableProducts, setEditableProducts] = useState([]);
            const [hasChanges, setHasChanges] = useState(false);
            const [uploading, setUploading] = useState(false);
            const [historyModalIdx, setHistoryModalIdx] = useState(null);
            const [newHistPrice, setNewHistPrice] = useState("");
            const [newHistDate, setNewHistDate] = useState(() => new Date().toISOString().split('T')[0]);
            const [statusMessage, setStatusMessage] = useState("");

            useEffect(() => {
                if (isOpen) {
                    setEditableProducts(dbProducts.map(p => ({
                        ...p,
                        GiaNhap: p.GiaNhap || 0,
                        NgayNhap: p.NgayNhap || "",
                        LichSuNhap: Array.isArray(p.LichSuNhap) ? p.LichSuNhap.slice(0, 5) : (p.GiaNhap ? [{ gia: p.GiaNhap, ngay: p.NgayNhap || new Date().toISOString().split('T')[0] }] : [])
                    })));
                    setHasChanges(false);
                    setHistoryModalIdx(null);
                    setStatusMessage("");
                }
            }, [isOpen, dbProducts]);

            const showTempMessage = (msg) => {
                setStatusMessage(msg);
                setTimeout(() => setStatusMessage(""), 4000);
            };

            const handleExcelUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setUploading(true);
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const bstr = evt.target.result;
                        const workbook = XLSX.read(bstr, { type: 'binary' });
                        const wsname = workbook.SheetNames[0];
                        const jsonDataRaw = XLSX.utils.sheet_to_json(workbook.Sheets[wsname], { header: 1, defval: "" });
                        
                        let headerRowIndex = -1;
                        let headers = [];

                        for (let i = 0; i < Math.min(20, jsonDataRaw.length); i++) {
                            const row = jsonDataRaw[i];
                            if (!row || !Array.isArray(row)) continue;
                            const rowString = row.join("").toLowerCase();
                            if (rowString.includes('tên') || rowString.includes('ten') || rowString.includes('giá') || rowString.includes('gia') || rowString.includes('mô tả')) {
                                headerRowIndex = i;
                                headers = row.map(h => String(h || "").trim());
                                break;
                            }
                        }

                        if (headerRowIndex === -1) {
                            showTempMessage("LỖI ĐỌC FILE: Không tìm thấy dòng Tiêu đề. Vui lòng kiểm tra lại file!");
                            setUploading(false); return;
                        }

                        const jsonData = [];
                        for (let i = headerRowIndex + 1; i < jsonDataRaw.length; i++) {
                            const rowData = jsonDataRaw[i];
                            if (!rowData || rowData.every(cell => !cell || cell === "")) continue; 
                            let obj = {};
                            headers.forEach((header, index) => { if (header) obj[header] = rowData[index]; });
                            jsonData.push(obj);
                        }

                        const getColumnName = (obj, possibilities) => {
                            const keys = Object.keys(obj);
                            for (let p of possibilities) {
                                const exactMatch = keys.find(k => k.toLowerCase() === p.toLowerCase());
                                if (exactMatch) return exactMatch;
                            }
                            for (let key of keys) { 
                                const k = key.toLowerCase(); 
                                for (let p of possibilities) if (k.includes(p.toLowerCase())) return key; 
                            }
                            return null;
                        };

                        const todayStr = new Date().toISOString().split('T')[0];

                        const normalizedData = jsonData.map((item) => {
                            const nameKey = getColumnName(item, ['Tên SP', 'Ten SP', 'Tên sản phẩm', 'TenSP', 'Tên', 'Ten', 'Name', 'Model']);
                            const descKey = getColumnName(item, ['Mô tả', 'MoTa', 'Description', 'Thông số', 'Thông tin', 'Diễn giải']);
                            const brandKey = getColumnName(item, ['Hãng', 'Hang', 'Thương hiệu', 'Brand']);
                            const warKey = getColumnName(item, ['Bảo hành', 'BaoHanh', 'BH', 'Warranty']);
                            const unitKey = getColumnName(item, ['ĐVT', 'DVT', 'Đơn vị', 'Unit']);
                            const codeKey = getColumnName(item, ['Mã SP', 'Ma SP', 'Mã sản phẩm', 'Mã', 'SKU', 'Code', 'Model']);
                            const costKey = getColumnName(item, ['Giá nhập', 'Gia nhap', 'Giá vốn', 'Gia von', 'Cost', 'Import Price']);
                            const importDateKey = getColumnName(item, ['Ngày nhập', 'Ngay nhap', 'Import Date', 'Ngày']);
                            let priceKey = Object.keys(item).find(k => (k.toLowerCase().includes('giá') || k.toLowerCase().includes('gia') || k.toLowerCase().includes('price') || k.toLowerCase().includes('đơn giá')) && k !== costKey);

                            if (!nameKey || !item[nameKey]) return null;

                            let rawPrice = item[priceKey];
                            let parsedPrice = 0;
                            if (typeof rawPrice === 'number') { parsedPrice = rawPrice; } 
                            else if (rawPrice) { parsedPrice = parseInt(String(rawPrice).replace(/[^0-9]/g, ''), 10) || 0; }

                            let rawCost = costKey ? item[costKey] : 0;
                            let parsedCost = 0;
                            if (typeof rawCost === 'number') { parsedCost = rawCost; }
                            else if (rawCost) { parsedCost = parseInt(String(rawCost).replace(/[^0-9]/g, ''), 10) || 0; }

                            let parsedDate = importDateKey && item[importDateKey] ? String(item[importDateKey]).trim() : (parsedCost > 0 ? todayStr : "");

                            return {
                                id: Date.now().toString() + Math.random().toString(36).substr(2, 9),
                                MaSP: String(codeKey && item[codeKey] ? item[codeKey] : '').trim(),
                                TenSP: String(item[nameKey] || 'SP Chưa Tên').trim(),
                                MoTa: String(item[descKey] || '').trim(),
                                Hang: String(item[brandKey] || '').trim(),
                                BaoHanh: String(item[warKey] || '18').trim(),
                                DVT: String(item[unitKey] || 'Cái').trim(),
                                Gia: parsedPrice,
                                GiaNhap: parsedCost,
                                NgayNhap: parsedDate,
                                LichSuNhap: parsedCost > 0 ? [{ gia: parsedCost, ngay: parsedDate || todayStr }] : []
                            };
                        }).filter(i => i !== null);

                        if(normalizedData.length === 0) {
                            showTempMessage("Đã đọc file Excel nhưng không lọc được sản phẩm nào. Cột 'Tên SP' có thể đang trống!");
                        } else {
                            setEditableProducts([...normalizedData, ...editableProducts]);
                            setHasChanges(true);
                            showTempMessage(`Đã nạp ${normalizedData.length} sản phẩm từ Excel! Anh NHỚ BẤM LƯU để lưu vào máy nhé.`);
                        }
                    } catch (err) { 
                        console.error("Lỗi code:", err); showTempMessage("Lỗi khi đọc file Excel!");
                    } finally { 
                        setUploading(false); e.target.value = null; 
                    }
                };
                reader.readAsBinaryString(file);
            };

            const handleFieldChange = (index, field, value) => {
                const updated = [...editableProducts];
                updated[index][field] = value;
                if (field === 'GiaNhap' && !updated[index].NgayNhap) {
                    updated[index].NgayNhap = new Date().toISOString().split('T')[0];
                }
                setEditableProducts(updated);
                setHasChanges(true);
            };

            const handleAddHistoryEntry = (idx) => {
                const priceNum = parseInt(String(newHistPrice).replace(/[^0-9]/g, ''), 10) || 0;
                if (priceNum <= 0) return;
                const dateStr = newHistDate || new Date().toISOString().split('T')[0];
                const updated = [...editableProducts];
                const prod = updated[idx];
                const currentHist = Array.isArray(prod.LichSuNhap) ? prod.LichSuNhap : [];
                const updatedHist = [{ gia: priceNum, ngay: dateStr }, ...currentHist].slice(0, 5);
                prod.LichSuNhap = updatedHist;
                prod.GiaNhap = priceNum;
                prod.NgayNhap = dateStr;
                setEditableProducts(updated);
                setNewHistPrice("");
                setHasChanges(true);
            };

            const handleDeleteHistoryEntry = (prodIdx, histIdx) => {
                const updated = [...editableProducts];
                const prod = updated[prodIdx];
                const currentHist = Array.isArray(prod.LichSuNhap) ? [...prod.LichSuNhap] : [];
                currentHist.splice(histIdx, 1);
                prod.LichSuNhap = currentHist;
                if (currentHist.length > 0) {
                    prod.GiaNhap = currentHist[0].gia;
                    prod.NgayNhap = currentHist[0].ngay;
                }
                setEditableProducts(updated);
                setHasChanges(true);
            };

            const handleAddBlankProduct = () => {
                const todayStr = new Date().toISOString().split('T')[0];
                const newProd = {
                    id: Date.now().toString(),
                    MaSP: "",
                    TenSP: "Sản phẩm mới",
                    MoTa: "",
                    Hang: "",
                    BaoHanh: "18",
                    DVT: "Cái",
                    Gia: 0,
                    GiaNhap: 0,
                    NgayNhap: todayStr,
                    LichSuNhap: []
                };
                setEditableProducts([newProd, ...editableProducts]); 
                setHasChanges(true);
            };

            const handleDeleteRow = (index) => {
                const updated = [...editableProducts];
                updated.splice(index, 1);
                setEditableProducts(updated);
                setHasChanges(true);
            };

            const handleClearAll = () => {
                setEditableProducts([]);
                setHasChanges(true);
                showTempMessage("Đã xóa trắng danh sách trên bảng. Bấm 'LƯU THAY ĐỔI NGAY' để áp dụng vào máy.");
            };

            const handleSaveAll = () => {
                const todayStr = new Date().toISOString().split('T')[0];
                // Tự động ghi nhận Giá nhập & Ngày nhập mới vào lịch sử 5 lần gần nhất nếu có thay đổi
                const syncedProducts = editableProducts.map(p => {
                    const cost = parseInt(p.GiaNhap, 10) || 0;
                    const date = p.NgayNhap || todayStr;
                    let hist = Array.isArray(p.LichSuNhap) ? [...p.LichSuNhap] : [];
                    if (cost > 0) {
                        const latest = hist[0];
                        if (!latest || latest.gia !== cost || latest.ngay !== date) {
                            hist = [{ gia: cost, ngay: date }, ...hist].slice(0, 5);
                        }
                    }
                    return { ...p, GiaNhap: cost, NgayNhap: p.NgayNhap || (cost > 0 ? todayStr : ""), LichSuNhap: hist.slice(0, 5) };
                });

                if (localDbHelper.saveProducts(syncedProducts)) {
                    setEditableProducts(syncedProducts);
                    setHasChanges(false);
                    showTempMessage("✅ Đã lưu danh sách và cập nhật lịch sử giá nhập thành công!");
                    onReload(); 
                }
            };

            if (!isOpen) return null;

            const activeHistProd = historyModalIdx !== null ? editableProducts[historyModalIdx] : null;

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[200] p-2 sm:p-4">
                    <div className="bg-white rounded-lg shadow-xl w-full max-w-7xl h-[90vh] md:h-[85vh] flex flex-col overflow-hidden border border-gray-200 relative">
                        {/* Header Modal */}
                        <div className="p-3 md:p-4 border-b flex justify-between items-center bg-gray-50 shadow-sm relative z-10">
                            <div>
                                <h3 className="text-base md:text-lg font-bold flex items-center gap-2 text-gray-800">
                                    <Icons.Database /> Kho Sản Phẩm - Otiz Smarthome (Lưu trên máy)
                                </h3>
                                <p className="text-xs text-gray-500 mt-1">Sửa trực tiếp Giá bán, Giá nhập, Ngày nhập bên dưới. Tự động lưu tối đa 5 lần lịch sử giá nhập gần nhất.</p>
                            </div>
                            <div className="flex items-center gap-4">
                                <button onClick={onClose} className="text-gray-400 hover:text-gray-800 p-1 rounded-full hover:bg-gray-200 transition-colors">✕</button>
                            </div>
                        </div>
                        
                        {/* Toolbar Modal */}
                        <div className="p-3 md:p-4 bg-sky-50 border-b border-sky-100 flex flex-wrap gap-3 items-center justify-between shadow-inner relative z-10">
                            <div className="flex flex-wrap gap-2 items-center">
                                <label className={`flex items-center justify-center gap-2 px-3 md:px-4 py-2 text-xs md:text-sm text-white rounded shadow transition-colors w-full sm:w-auto ${uploading ? 'bg-orange-500 cursor-not-allowed' : 'bg-green-600 hover:bg-green-700 cursor-pointer'}`}>
                                    <Icons.Upload size={14}/> {uploading ? "Đang đọc..." : "Nạp từ Excel"}
                                    <input type="file" accept=".xlsx, .xls" onChange={handleExcelUpload} disabled={uploading} className="hidden"/>
                                </label>
                                <button onClick={handleAddBlankProduct} className="flex items-center gap-2 px-3 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs md:text-sm rounded shadow transition-colors w-full sm:w-auto justify-center">
                                    <Icons.Plus size={14}/> Thêm thủ công
                                </button>
                                <button onClick={handleClearAll} className="flex items-center gap-2 px-3 py-2 bg-red-500 hover:bg-red-600 text-white text-xs md:text-sm rounded shadow transition-colors w-full sm:w-auto justify-center" title="Xóa toàn bộ để nạp file mới">
                                    <Icons.Trash2 size={14}/> Xóa tất cả
                                </button>
                                {statusMessage && (
                                    <span className="text-xs font-bold text-emerald-700 bg-emerald-100 border border-emerald-300 px-3 py-1.5 rounded-full animate-pulse">
                                        {statusMessage}
                                    </span>
                                )}
                            </div>

                            <div className="flex items-center gap-3 w-full lg:w-auto mt-2 lg:mt-0">
                                <span className="text-xs text-gray-600 font-medium whitespace-nowrap">Tổng: {editableProducts.length} SP</span>
                                <button 
                                    onClick={handleSaveAll} 
                                    className={`flex-1 sm:flex-none flex items-center justify-center gap-2 px-4 py-2 text-sm text-white rounded shadow-md transition-all ${hasChanges ? 'bg-orange-600 hover:bg-orange-700 animate-pulse ring-2 ring-orange-400 ring-offset-2' : 'bg-sky-600 hover:bg-sky-700 opacity-90'}`}
                                >
                                    <Icons.Save size={16}/> {hasChanges ? 'LƯU THAY ĐỔI NGAY' : 'Đã Lưu'}
                                </button>
                            </div>
                        </div>

                        {/* Table Area */}
                        <div className="flex-1 overflow-x-auto overflow-y-auto bg-gray-50 hide-scrollbar relative">
                            <table className="w-full min-w-[1050px] border-collapse text-xs md:text-sm bg-white shadow-sm">
                                <thead className="bg-gray-200 sticky top-0 shadow-sm z-20">
                                    <tr>
                                        <th className="border-b p-2 md:p-3 text-left w-10 text-gray-600">#</th>
                                        <th className="border-b border-l p-2 md:p-3 text-left w-24 text-gray-600" title="Đặt mã SP để tool tự động gọi ảnh trên GitHub">Mã SP</th>
                                        <th className="border-b border-l p-2 md:p-3 text-left text-gray-600">Tên Sản Phẩm</th>
                                        <th className="border-b border-l p-2 md:p-3 text-left w-32 text-gray-600">Giá Bán (VNĐ)</th>
                                        <th className="border-b border-l p-2 md:p-3 text-left w-32 text-amber-800 bg-amber-50">Giá Nhập (VNĐ)</th>
                                        <th className="border-b border-l p-2 md:p-3 text-left w-36 text-amber-800 bg-amber-50">Ngày Nhập</th>
                                        <th className="border-b border-l p-2 md:p-3 text-center w-28 text-amber-800 bg-amber-50">Lịch Sử Giá</th>
                                        <th className="border-b border-l p-2 md:p-3 text-left w-20 text-gray-600">ĐVT</th>
                                        <th className="border-b border-l p-2 md:p-3 text-left w-24 text-gray-600">Hãng</th>
                                        <th className="border-b border-l p-2 md:p-3 text-left w-16 text-gray-600">BH(T)</th>
                                        <th className="border-b border-l p-2 md:p-3 w-12 text-center text-gray-600">Xóa</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {editableProducts.length === 0 && (
                                        <tr><td colSpan="11" className="text-center p-12 text-gray-400 text-base">Kho trống. Hãy nạp file Excel hoặc Thêm thủ công.</td></tr>
                                    )}
                                    {editableProducts.map((p, idx) => {
                                        const histCount = Array.isArray(p.LichSuNhap) ? p.LichSuNhap.length : 0;
                                        return (
                                            <tr key={idx} className="hover:bg-sky-50 transition-colors border-b border-gray-100 group">
                                                <td className="p-2 text-center text-gray-400">{idx + 1}</td>
                                                <td className="p-1 border-l border-gray-100">
                                                    <input 
                                                        type="text" 
                                                        value={p.MaSP || ''} 
                                                        onChange={(e) => handleFieldChange(idx, 'MaSP', e.target.value)}
                                                        className="w-full px-2 py-1.5 bg-sky-50/50 border border-transparent focus:border-sky-400 focus:bg-white focus:ring-1 ring-sky-200 outline-none rounded font-bold text-sky-800 transition-all uppercase"
                                                        placeholder="VD: M1S"
                                                    />
                                                </td>
                                                <td className="p-1 border-l border-gray-100">
                                                    <input 
                                                        type="text" 
                                                        value={p.TenSP} 
                                                        onChange={(e) => handleFieldChange(idx, 'TenSP', e.target.value)}
                                                        className="w-full px-2 py-1.5 bg-transparent border border-transparent focus:border-sky-400 focus:bg-white focus:ring-1 ring-sky-200 outline-none rounded font-medium text-gray-800 transition-all"
                                                        placeholder="Tên sản phẩm..."
                                                    />
                                                </td>
                                                <td className="p-1 border-l border-gray-100 relative">
                                                    <input 
                                                        type="number" 
                                                        value={p.Gia} 
                                                        onChange={(e) => handleFieldChange(idx, 'Gia', parseInt(e.target.value) || 0)}
                                                        className="w-full px-2 py-1.5 bg-transparent border border-transparent focus:border-sky-400 focus:bg-white focus:ring-1 ring-sky-200 outline-none rounded font-bold text-sky-600 text-right transition-all pr-5"
                                                    />
                                                    <span className="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none text-[10px]">đ</span>
                                                </td>
                                                <td className="p-1 border-l border-gray-100 bg-amber-50/30 relative">
                                                    <input 
                                                        type="number" 
                                                        value={p.GiaNhap || 0} 
                                                        onChange={(e) => handleFieldChange(idx, 'GiaNhap', parseInt(e.target.value) || 0)}
                                                        className="w-full px-2 py-1.5 bg-transparent border border-transparent focus:border-amber-400 focus:bg-white focus:ring-1 ring-amber-200 outline-none rounded font-bold text-amber-700 text-right transition-all pr-5"
                                                    />
                                                    <span className="absolute right-2 top-1/2 -translate-y-1/2 text-amber-400 pointer-events-none text-[10px]">đ</span>
                                                </td>
                                                <td className="p-1 border-l border-gray-100 bg-amber-50/30">
                                                    <input 
                                                        type="date" 
                                                        value={p.NgayNhap || ''} 
                                                        onChange={(e) => handleFieldChange(idx, 'NgayNhap', e.target.value)}
                                                        className="w-full px-2 py-1.5 bg-transparent border border-transparent focus:border-amber-400 focus:bg-white focus:ring-1 ring-amber-200 outline-none rounded text-center text-xs text-gray-700 transition-all"
                                                    />
                                                </td>
                                                <td className="p-1 border-l border-gray-100 bg-amber-50/30 text-center">
                                                    <button 
                                                        onClick={() => {
                                                            setHistoryModalIdx(idx);
                                                            setNewHistPrice(p.GiaNhap || "");
                                                            setNewHistDate(p.NgayNhap || new Date().toISOString().split('T')[0]);
                                                        }}
                                                        className="inline-flex items-center gap-1 px-2.5 py-1 bg-amber-100 hover:bg-amber-200 text-amber-800 rounded-full text-xs font-semibold transition-colors"
                                                        title="Xem & thêm lịch sử nhập giá (Tối đa 5 lần gần nhất)"
                                                    >
                                                        <Icons.History size={13}/> ({histCount}/5)
                                                    </button>
                                                </td>
                                                <td className="p-1 border-l border-gray-100">
                                                    <input 
                                                        type="text" 
                                                        value={p.DVT} 
                                                        onChange={(e) => handleFieldChange(idx, 'DVT', e.target.value)}
                                                        className="w-full px-2 py-1.5 bg-transparent border border-transparent focus:border-sky-400 focus:bg-white focus:ring-1 ring-sky-200 outline-none rounded text-center transition-all text-gray-600"
                                                    />
                                                </td>
                                                <td className="p-1 border-l border-gray-100">
                                                    <input 
                                                        type="text" 
                                                        value={p.Hang} 
                                                        onChange={(e) => handleFieldChange(idx, 'Hang', e.target.value)}
                                                        className="w-full px-2 py-1.5 bg-transparent border border-transparent focus:border-sky-400 focus:bg-white focus:ring-1 ring-sky-200 outline-none rounded text-center uppercase transition-all text-gray-600"
                                                    />
                                                </td>
                                                <td className="p-1 border-l border-gray-100">
                                                    <input 
                                                        type="text" 
                                                        value={p.BaoHanh} 
                                                        onChange={(e) => handleFieldChange(idx, 'BaoHanh', e.target.value)}
                                                        className="w-full px-2 py-1.5 bg-transparent border border-transparent focus:border-sky-400 focus:bg-white focus:ring-1 ring-sky-200 outline-none rounded text-center transition-all text-gray-600"
                                                    />
                                                </td>
                                                <td className="p-1 border-l border-gray-100 text-center">
                                                    <button onClick={() => handleDeleteRow(idx)} className="text-red-400 hover:text-red-600 hover:bg-red-50 p-1.5 rounded transition-colors" title="Xóa dòng này">
                                                        <Icons.Trash2 size={16}/>
                                                    </button>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>

                        {/* Modal Lịch Sử Nhập Giá (5 lần gần nhất) */}
                        {activeHistProd && (
                            <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[250] p-4">
                                <div className="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden border border-amber-200">
                                    <div className="p-4 bg-amber-50 border-b border-amber-200 flex justify-between items-center">
                                        <div>
                                            <h4 className="font-bold text-amber-900 flex items-center gap-2 text-sm md:text-base">
                                                <Icons.History size={18}/> Lịch Sử Nhập Giá (5 lần gần nhất)
                                            </h4>
                                            <p className="text-xs text-amber-700 font-medium mt-0.5 truncate max-w-[320px]">
                                                {activeHistProd.MaSP ? `[${activeHistProd.MaSP}] ` : ''}{activeHistProd.TenSP}
                                            </p>
                                        </div>
                                        <button onClick={() => setHistoryModalIdx(null)} className="text-gray-400 hover:text-gray-700 p-1 rounded-full hover:bg-amber-100">✕</button>
                                    </div>

                                    <div className="p-4 space-y-4">
                                        {/* Form thêm nhanh lần nhập mới */}
                                        <div className="bg-gray-50 p-3 rounded-lg border border-gray-200">
                                            <div className="text-xs font-bold text-gray-700 mb-2">Thêm lần nhập giá mới:</div>
                                            <div className="flex gap-2 items-center">
                                                <input 
                                                    type="number" 
                                                    value={newHistPrice} 
                                                    onChange={(e) => setNewHistPrice(e.target.value)}
                                                    placeholder="Giá nhập (VNĐ)..."
                                                    className="flex-1 border border-gray-300 rounded px-2.5 py-1.5 text-xs outline-none focus:border-amber-500 font-bold text-amber-800"
                                                />
                                                <input 
                                                    type="date" 
                                                    value={newHistDate} 
                                                    onChange={(e) => setNewHistDate(e.target.value)}
                                                    className="w-36 border border-gray-300 rounded px-2 py-1.5 text-xs outline-none focus:border-amber-500"
                                                />
                                                <button 
                                                    onClick={() => handleAddHistoryEntry(historyModalIdx)}
                                                    className="bg-amber-600 hover:bg-amber-700 text-white px-3 py-1.5 rounded text-xs font-bold shadow-sm transition-colors whitespace-nowrap"
                                                >
                                                    + Lưu
                                                </button>
                                            </div>
                                        </div>

                                        {/* Danh sách 5 lần gần nhất */}
                                        <div>
                                            <div className="text-xs font-bold text-gray-600 mb-2 flex justify-between">
                                                <span>Danh sách lưu trữ (Mới nhất ở trên):</span>
                                                <span>{(activeHistProd.LichSuNhap || []).length}/5 lần</span>
                                            </div>
                                            {(!activeHistProd.LichSuNhap || activeHistProd.LichSuNhap.length === 0) ? (
                                                <div className="text-center py-6 text-xs text-gray-400 bg-gray-50 rounded border border-dashed">
                                                    Chưa có lịch sử giá nhập cho sản phẩm này.
                                                </div>
                                            ) : (
                                                <div className="divide-y border rounded-lg overflow-hidden">
                                                    {activeHistProd.LichSuNhap.slice(0, 5).map((h, hIdx) => (
                                                        <div key={hIdx} className={`flex items-center justify-between p-2.5 text-xs ${hIdx === 0 ? 'bg-amber-50/70 font-bold' : 'bg-white'}`}>
                                                            <div className="flex items-center gap-2">
                                                                <span className={`w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-bold ${hIdx === 0 ? 'bg-amber-500 text-white' : 'bg-gray-200 text-gray-600'}`}>
                                                                    {hIdx + 1}
                                                                </span>
                                                                <div>
                                                                    <div className="text-amber-800 font-bold">
                                                                        {new Intl.NumberFormat('vi-VN').format(h.gia || 0)} đ
                                                                        {hIdx === 0 && <span className="ml-2 text-[10px] bg-green-100 text-green-700 px-1.5 py-0.5 rounded">Hiện tại</span>}
                                                                    </div>
                                                                    <div className="text-[11px] text-gray-500">
                                                                        Ngày nhập: {h.ngay ? new Date(h.ngay).toLocaleDateString('vi-VN') : 'Chưa rõ'}
                                                                    </div>
                                                                </div>
                                                            </div>
                                                            <button 
                                                                onClick={() => handleDeleteHistoryEntry(historyModalIdx, hIdx)}
                                                                className="text-red-400 hover:text-red-600 p-1 rounded hover:bg-red-50"
                                                                title="Xóa lần nhập này"
                                                            >
                                                                <Icons.Trash2 size={14}/>
                                                            </button>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    </div>

                                    <div className="p-3 bg-gray-50 border-t text-right">
                                        <button onClick={() => setHistoryModalIdx(null)} className="px-4 py-1.5 bg-gray-700 hover:bg-gray-800 text-white rounded text-xs font-bold">
                                            Đóng
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const ProductAutocomplete = ({ value, onChange, onSelectProduct, dbProducts, isPreviewMode, placeholder, className, style, formatCurrency }) => {
            const [suggestions, setSuggestions] = useState([]);
            const [showSuggestions, setShowSuggestions] = useState(false);
            const wrapperRef = useRef(null);

            useEffect(() => {
                const handleClickOutside = (event) => { if (wrapperRef.current && !wrapperRef.current.contains(event.target)) setShowSuggestions(false); };
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, []);

            const handleInputChange = (e) => {
                const text = e.target.value;
                onChange(e);
                if (text.length > 0 && dbProducts.length > 0) {
                    const lowerText = text.toLowerCase();
                    const filtered = dbProducts.filter(p => 
                        (p.TenSP && String(p.TenSP).toLowerCase().includes(lowerText)) ||
                        (p.MaSP && String(p.MaSP).toLowerCase().includes(lowerText))
                    ).slice(0, 15);
                    setSuggestions(filtered);
                    setShowSuggestions(true);
                } else { setShowSuggestions(false); }
            };

            const handleSelectSuggestion = (item) => { onSelectProduct(item); setShowSuggestions(false); };

            if (isPreviewMode) return <div className={`${className} whitespace-pre-wrap`} style={style}>{value}</div>;

            return (
                <div className="relative w-full" ref={wrapperRef}>
                    <SmartTextarea value={value} onChange={handleInputChange} className={`bg-sky-50/30 hover:bg-sky-50 focus:bg-white focus:ring-1 ring-sky-300 outline-none w-full transition-colors ${className}`} style={style} placeholder={placeholder} />
                    {showSuggestions && suggestions.length > 0 && (
                        <div className="suggestions-list shadow-2xl border-sky-200">
                            {suggestions.map((item, idx) => (
                                <div key={idx} className="suggestion-item hover:bg-sky-50 border-b border-gray-100 last:border-0" onClick={() => handleSelectSuggestion(item)}>
                                    <div className="font-bold text-gray-800">
                                        {item.MaSP && <span className="text-sky-600 mr-1 text-xs">[{item.MaSP}]</span>}
                                        {item.TenSP}
                                    </div>
                                    <div className="text-gray-500 flex justify-between mt-1 text-[10px] md:text-xs">
                                        <span className="bg-gray-100 px-1 rounded font-medium">{item.Hang || 'N/A'}</span>
                                        <span className="suggestion-price text-sky-600">{formatCurrency(item.Gia || 0)}</span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        // Hàm hỗ trợ tải ảnh URL thành base64 (Dùng cho Excel)
        const getBase64FromUrl = async (url) => {
            try {
                const data = await fetch(url);
                const blob = await data.blob();
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(blob);
                    reader.onloadend = () => { resolve(reader.result); }
                });
            } catch(e) { return null; }
        };

        // --- MAIN APP ---
        const QuoteTool = () => {
            const [isPreviewMode, setIsPreviewMode] = useState(false);
            const [dbProducts, setDbProducts] = useState([]);
            const [showProductManager, setShowProductManager] = useState(false);
            const [exportingExcel, setExportingExcel] = useState(false);
            
            // Cài đặt chung của Tool (Ngôn ngữ, Tiền tệ, Khổ in)
            const [appConfig, setAppConfig] = useState({
                lang: 'vi',
                currency: 'VND',
                exchangeRate: 25400, // Tỉ giá mặc định 1 USD = 25,400 VNĐ
                printOrientation: 'portrait'
            });

            const [data, setData] = useState({
                fileName: "Báo giá mới",
                projectTitle: "BÁO GIÁ_Smart Home",
                companyInfo: { logo: null, name: "Otiz Smarthome", subName: "Giải pháp chiếu sáng chuyên nghiệp và thông minh toàn diện", address: "otizsmarthome@gmail.com", website: "Otizsmarthome.io.vn", hotline: "0363035960" },
                customerInfo: { companyName: "CÔNG TY TNHH TƯ VẤN THIẾT KẾ VÀ XÂY DỰNG NGUYÊN KHÁNH", mst: "316419615", address: "L18-11-13, Tầng 18, Tòa nhà Vincom Center Đồng Khởi, 72 Lê Thánh Tôn, P. Bến Nghé, Q.1, TP.HCM", contactName: "Anh Khánh", phone: "0911981618", quoteDate: new Date().toISOString().split('T')[0] },
                items: [{ id: 1, title: "(I) BỘ ĐIỀU KHIỂN TRUNG TÂM + ĐIỀU HÒA", products: [{ id: 101, MaSP: "", name: "Bộ điều khiển trung tâm Camera Hub G3", description: "", image: null, brand: "AQARA", warranty: 18, qty: 1, unit: "Bộ", price: 3299000, costPrice: 0 }] }],
                financials: { discountType: 'amount', discountValue: 0, installationType: 'amount', installationValue: 11000000, showDiscount: true, showInstall: true },
                paymentInfo: { show: false, title: "Tài khoản cá nhân:", stk: "STK: ... - Ngân hàng", ctk: "CTK: Trường Otiz" },
                serviceInfo: { show1: true, show2: true, title1: "(1) Phí lắp đặt bao gồm:", desc1: "- Thi công phần cứng toàn bộ hệ thống Smarthome.\n- Không bao gồm chi phí kéo dây điện, đục tường.", title2: "(2) Phí dịch vụ bao gồm:", desc2: "- Bảo hành tận nơi 30 ngày và bảo hành từ xa theo thời gian bảo hành sản phẩm.\n- Kết nối toàn bộ hệ thống.\n- Thiết kế hệ thống, Cấu hình tự động hóa.\n- Chia phòng, đặt tên thiết bị, cấu hình tự động.\n- Hướng dẫn khách hàng thao tác sử dụng." },
                settings: { showHeader: true, showPrices: true, showDiscountedPrice: true, hideDiscountedOnPrint: true, showFinancials: true, showSignatures: true, showDate: true, showCustomerInfo: true, showGreeting: true },
                greetingNote: "Otiz Smarthome xin chân thành cảm ơn Quý Khách đã quan tâm đến sản phẩm của chúng tôi, phúc đáp theo yêu cầu của Quý Khách chúng tôi xin gửi bảng báo giá như sau:",
                footerNote: "Báo giá có giá trị 2 tuần - Otiz Smarthome",
                signatures: { partyA: "ĐẠI DIỆN KHÁCH HÀNG\n(Ký và ghi rõ họ tên)", partyB: "ĐẠI DIỆN BÊN BÁN\n(Ký và ghi rõ họ tên)" }
            });

            const t = i18n[appConfig.lang]; 

            const reloadProducts = () => {
                const prods = localDbHelper.getProducts();

            };

            useEffect(() => { reloadProducts(); }, []);

            const handleExportQuote = () => {
                const dataStr = JSON.stringify(data);
                const blob = new Blob([dataStr], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `${data.fileName || 'BaoGia'}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            const handleImportQuote = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                reader.onload = (evt) => {

                        const parsedData = JSON.parse(evt.target.result);

                            // TỰ ĐỘNG ÉP NGÀY BÁO GIÁ VỀ NGÀY HIỆN TẠI KHI MỞ FILE CŨ

                        alert("Lỗi khi đọc file. Có thể file đã bị hỏng!");

                };
                reader.readAsText(file);
                e.target.value = null;

            // HÀM XUẤT EXCEL CHUYÊN NGHIỆP
            const handleExportExcel = async () => {
                setExportingExcel(true);
                try {
                    const ExcelJS = window.ExcelJS;
                    if (!ExcelJS) { alert("Thư viện Excel chưa được tải xong, vui lòng thử lại sau vài giây."); return; }
                    
                    const workbook = new ExcelJS.Workbook();
                    const sheet = workbook.addWorksheet('Báo Giá', {

                    // Cột độ rộng chuẩn
                    sheet.columns = [
                        { width: 6 },  // A: STT
                        { width: 14 }, // B: Hình ảnh
                        { width: 45 }, // C: Tên / Mô tả
                        { width: 12 }, // D: Hãng
                        { width: 8 },  // E: BH
                        { width: 8 },  // F: SL
                        { width: 10 }, // G: ĐVT
                        { width: 15 }, // H: Đơn giá
                        { width: 18 }  // I: Thành tiền
                    ];

                    let currentRow = 1;

                    // Header
                    if (data.settings?.showHeader !== false) {
                        sheet.mergeCells(`C${currentRow}:I${currentRow}`);
                        sheet.getCell(`C${currentRow}`).value = data.companyInfo.name;
                        sheet.getCell(`C${currentRow}`).font = { bold: true, size: 16 };
                        sheet.getCell(`C${currentRow}`).alignment = { vertical: 'middle', horizontal: 'left' };
                        currentRow++;

                        sheet.mergeCells(`C${currentRow}:I${currentRow}`);
                        sheet.getCell(`C${currentRow}`).value = data.companyInfo.subName;
                        sheet.getCell(`C${currentRow}`).font = { italic: true, size: 10, color: { argb: 'FF666666' } };
                        currentRow++;

                        if (data.companyInfo.logo) {
                            try {
                                const logoId = workbook.addImage({ base64: data.companyInfo.logo, extension: 'png' });
                                sheet.mergeCells('A1:B4');
                                sheet.addImage(logoId, 'A1:B4');
                            } catch(e) {}
                        }
                        
                        sheet.mergeCells(`C${currentRow}:I${currentRow}`);
                        sheet.getCell(`C${currentRow}`).value = `Email: ${data.companyInfo.address} | Web: ${data.companyInfo.website} | Hotline: ${data.companyInfo.hotline}`;

                        currentRow += 2; 
                    }

                    // Title
                    sheet.mergeCells(`A${currentRow}:I${currentRow}`);
                    const titleCell = sheet.getCell(`A${currentRow}`);

                    titleCell.font = { bold: true, size: 18, color: { argb: 'FF0284C7' } }; 
                    titleCell.alignment = { vertical: 'middle', horizontal: 'center' };
                    currentRow += 2;

                    // Info Khách hàng
                    if (data.settings?.showCustomerInfo !== false) {
                        sheet.mergeCells(`A${currentRow}:E${currentRow}`);
                        sheet.getCell(`A${currentRow}`).value = `Khách hàng: ${data.customerInfo.companyName}`;
                        sheet.mergeCells(`F${currentRow}:I${currentRow}`);
                        sheet.getCell(`F${currentRow}`).value = `Ngày báo giá: ${new Date(data.customerInfo.quoteDate).toLocaleDateString('vi-VN')}`;
                        sheet.getCell(`F${currentRow}`).alignment = { horizontal: 'right' };
                        currentRow++;

                        sheet.mergeCells(`A${currentRow}:E${currentRow}`);
                        sheet.getCell(`A${currentRow}`).value = `Địa chỉ: ${data.customerInfo.address}`;
                        sheet.mergeCells(`F${currentRow}:I${currentRow}`);
                        sheet.getCell(`F${currentRow}`).value = `Liên hệ: ${data.customerInfo.contactName} - SĐT: ${data.customerInfo.phone}`;
                        sheet.getCell(`F${currentRow}`).alignment = { horizontal: 'right' };
                        currentRow += 2;
                    }

                    // Table Headers
                    const headerRow = sheet.getRow(currentRow);
                    const headers = ["STT", "Hình ảnh", "Tên thiết bị / Mô tả tính năng", "Hãng", "BH(T)", "SL", "ĐVT", "Đơn giá", "Thành tiền"];
                    headers.forEach((h, i) => {
                        const cell = headerRow.getCell(i + 1);
                        cell.value = h;
                        cell.font = { bold: true, color: { argb: 'FFFFFFFF' } }; 
                        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0284C7' } }; 
                        cell.alignment = { vertical: 'middle', horizontal: 'center' };
                        cell.border = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} };
                    });
                    currentRow++;

                    // Chuyển đổi tiền tệ cho Excel
                    const rate = appConfig.currency === 'USD' ? appConfig.exchangeRate : 1;
                    const numFormat = appConfig.currency === 'USD' ? '$#,##0.00' : '#,##0';

                    // Data Hàng hóa
                    for (const cat of data.items) {
                        sheet.mergeCells(`A${currentRow}:I${currentRow}`);
                        const catCell = sheet.getCell(`A${currentRow}`);
                        catCell.value = cat.title;
                        catCell.font = { bold: true, color: { argb: 'FF075985' } }; 
                        catCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE0F2FE' } }; 
                        catCell.border = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} };
                        currentRow++;

                        for (let pIdx = 0; pIdx < cat.products.length; pIdx++) {
                            const p = cat.products[pIdx];
                            const row = sheet.getRow(currentRow);
                            row.height = 75; // Kéo cao dòng để hình ảnh hiển thị vuông vắn 70x70

                            row.getCell(1).value = pIdx + 1;
                            row.getCell(1).alignment = { vertical: 'middle', horizontal: 'center' };
                            
                            row.getCell(3).value = p.name + (p.description ? `\n${p.description}` : '');
                            row.getCell(3).alignment = { vertical: 'middle', wrapText: true };
                            
                            row.getCell(4).value = p.brand;
                            row.getCell(4).alignment = { vertical: 'middle', horizontal: 'center' };
                            row.getCell(5).value = p.warranty;
                            row.getCell(5).alignment = { vertical: 'middle', horizontal: 'center' };
                            row.getCell(6).value = p.qty;
                            row.getCell(6).alignment = { vertical: 'middle', horizontal: 'center' };
                            row.getCell(7).value = p.unit;
                            row.getCell(7).alignment = { vertical: 'middle', horizontal: 'center' };
                            
                            if (data.settings?.showPrices !== false) {
                                row.getCell(8).value = p.price / rate;
                                row.getCell(8).numFmt = numFormat;
                                row.getCell(9).value = (p.qty * p.price) / rate;
                                row.getCell(9).numFmt = numFormat;
                            }

                            for(let i=1; i<=9; i++) row.getCell(i).border = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} };

                            // CHÈN ẢNH VỚI KÍCH THƯỚC TUYỆT ĐỐI (Tránh méo ảnh)
                            const addImageToExcel = (base64Data) => {
                                try {
                                    const imgId = workbook.addImage({ base64: base64Data, extension: 'jpeg' });
                                    sheet.addImage(imgId, {
                                        tl: { col: 1.15, row: currentRow - 1 + 0.1 }, // Col B = 1. Add offset. Row is 0-indexed here
                                        ext: { width: 70, height: 70 }, // Neo cứng kích thước 70x70 pixel
                                        editAs: 'oneCell' // Không cho ảnh chạy lung tung khi đổi size cột
                                    });
                                } catch(e) { console.log(e); }
                            };

                            if (p.image) {
                                addImageToExcel(p.image);
                            } else if (p.MaSP) {
                                // Tự mò ảnh từ GitHub qua URL
                                const urlFormats = ['.jpg', '.png', '.jpeg', '.JPG', '.PNG'];
                                for (let ext of urlFormats) {
                                    const base64 = await getBase64FromUrl(`./images/${p.MaSP.trim()}${ext}`);
                                    if(base64) {
                                        addImageToExcel(base64);
                                        break; // Tìm thấy thì thoát vòng lặp
                                    }
                                }
                            }
                            currentRow++;
                        }
                    }

                    // Totals
                    currentRow += 1;
                    if (data.settings?.showFinancials !== false && data.settings?.showPrices !== false) {
                        const totals = calculateTotal();
                        sheet.mergeCells(`G${currentRow}:H${currentRow}`);
                        sheet.getCell(`G${currentRow}`).value = t.subtotal;
                        sheet.getCell(`G${currentRow}`).font = { bold: true };
                        sheet.getCell(`I${currentRow}`).value = totals.subtotal / rate;
                        sheet.getCell(`I${currentRow}`).numFmt = numFormat;
                        currentRow++;

                        if (data.financials?.showDiscount !== false) {
                            sheet.mergeCells(`G${currentRow}:H${currentRow}`);
                            sheet.getCell(`G${currentRow}`).value = `${data.financials.discountLabel || t.discount} (${data.financials.discountType === 'percent' ? data.financials.discountValue + '%' : 'Tiền'}):`;
                            sheet.getCell(`I${currentRow}`).value = -(totals.discount / rate);
                            sheet.getCell(`I${currentRow}`).numFmt = numFormat;
                            sheet.getCell(`I${currentRow}`).font = { color: { argb: 'FFFF0000' } }; 
                            currentRow++;
                        }

                        if (data.financials?.showInstall !== false) {
                            sheet.mergeCells(`G${currentRow}:H${currentRow}`);
                            sheet.getCell(`G${currentRow}`).value = `${data.financials.installLabel || t.installFee} (${data.financials.installationType === 'percent' ? data.financials.installationValue + '%' : 'Tiền'}):`;
                            sheet.getCell(`I${currentRow}`).value = totals.install / rate;
                            sheet.getCell(`I${currentRow}`).numFmt = numFormat;
                            currentRow++;
                        }

                        sheet.mergeCells(`G${currentRow}:H${currentRow}`);
                        sheet.getCell(`G${currentRow}`).value = t.grandTotal;
                        sheet.getCell(`G${currentRow}`).font = { bold: true, size: 14, color: { argb: 'FFFFFFFF' } };
                        sheet.getCell(`G${currentRow}`).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0284C7' } };
                        sheet.getCell(`G${currentRow}`).alignment = { vertical: 'middle', horizontal: 'right' };
                        
                        sheet.getCell(`I${currentRow}`).value = totals.total / rate;
                        sheet.getCell(`I${currentRow}`).font = { bold: true, size: 14, color: { argb: 'FFFFFFFF' } };
                        sheet.getCell(`I${currentRow}`).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0284C7' } };
                        sheet.getCell(`I${currentRow}`).numFmt = numFormat;
                        currentRow += 3; 
                    }

                    // Signatures
                    if (data.settings?.showSignatures !== false) {
                        sheet.mergeCells(`B${currentRow}:D${currentRow}`);
                        sheet.getCell(`B${currentRow}`).value = data.signatures?.partyA || "ĐẠI DIỆN KHÁCH HÀNG\n(Ký và ghi rõ họ tên)";
                        sheet.getCell(`B${currentRow}`).alignment = { wrapText: true, horizontal: 'center' };
                        sheet.getCell(`B${currentRow}`).font = { bold: true };

                        sheet.mergeCells(`G${currentRow}:I${currentRow}`);
                        sheet.getCell(`G${currentRow}`).value = data.signatures?.partyB || "ĐẠI DIỆN BÊN BÁN\n(Ký và ghi rõ họ tên)";
                        sheet.getCell(`G${currentRow}`).alignment = { wrapText: true, horizontal: 'center' };
                        sheet.getCell(`G${currentRow}`).font = { bold: true };
                    }

                    const buffer = await workbook.xlsx.writeBuffer();
                    const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                    window.saveAs(blob, `${data.fileName || 'BaoGia'}.xlsx`);

                } catch (e) {
                    console.error("Lỗi tạo Excel:", e);
                    alert("Lỗi xuất Excel: Không thể tạo file. Chi tiết: " + e.message);
                } finally {
                    setExportingExcel(false);
                }
            };

            const handleFileUpload = (e, callback) => { const file = e.target.files[0]; if (file) { const reader = new FileReader(); reader.onloadend = () => callback(reader.result); reader.readAsDataURL(file); } };
            
            const handleAutoFillProduct = (catIdx, prodIdx, productData) => {
                const newData = {...data}; const prod = newData.items[catIdx].products[prodIdx];
                prod.name = productData.TenSP; 
                prod.MaSP = productData.MaSP; 
                prod.description = productData.MoTa || ''; 
                prod.brand = productData.Hang || ''; 
                prod.warranty = productData.BaoHanh || '18'; 
                prod.unit = productData.DVT || 'Cái'; 
                prod.price = parseFloat(productData.Gia) || 0;
                prod.costPrice = parseFloat(productData.GiaNhap) || 0;
                setData(newData);
            };
            
            const calculateTotal = () => {
                let subtotal = 0; data.items.forEach(c => c.products.forEach(p => subtotal += p.qty * p.price));
                let discount = data.financials.discountType === 'percent' ? (subtotal * data.financials.discountValue) / 100 : data.financials.discountValue;
                let install = data.financials.installationType === 'percent' ? (subtotal * data.financials.installationValue) / 100 : data.financials.installationValue;
                
                if (data.financials.showDiscount === false) discount = 0;
                if (data.financials.showInstall === false) install = 0;

                return { subtotal, discount, install, total: (subtotal - discount) + install };
            };

            const totals = calculateTotal();
            // Tỉ lệ chiết khấu thực tế trên báo giá để tính Đơn giá sau CK cho từng sản phẩm
            const effectiveDiscountRatio = totals.subtotal > 0 ? (totals.discount / totals.subtotal) : 0;

            // HÀM CHUYỂN ĐỔI TIỀN TỆ (VND <-> USD) THÔNG MINH
            const formatCurrency = (amt, isEditing = false) => {
                // Nếu đang gõ sửa giá (input), phải giữ nguyên số VND gốc để không bị loạn số thập phân
                if (isEditing) return Math.round(amt); 
                
                const rate = appConfig.currency === 'USD' ? appConfig.exchangeRate : 1;
                const converted = amt / rate;

                if (appConfig.currency === 'USD') {
                    return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(converted);
                }
                // Mặc định VND
                return new Intl.NumberFormat(appConfig.lang === 'vi' ? 'vi-VN' : 'en-US').format(Math.round(converted));
            };

            const handlePrint = () => { if (!isPreviewMode) { setIsPreviewMode(true); setTimeout(() => { document.title = data.fileName; window.print(); }, 500); } else { document.title = data.fileName; window.print(); } };
            const updateItem = (catIdx, prodIdx, field, val) => { const newData = {...data}; newData.items[catIdx].products[prodIdx][field] = val; setData(newData); };
            const addCategory = () => { const newData = {...data}; newData.items.push({ id: Date.now(), title: "(...) HẠNG MỤC MỚI", products: [] }); setData(newData); };
            const addProduct = (catIdx) => { const newData = {...data}; newData.items[catIdx].products.push({ id: Date.now(), MaSP: "", name: "Sản phẩm mới", description: "", image: null, brand: "", warranty: 18, qty: 1, unit: "Cái", price: 0 }); setData(newData); };
            const removeCategory = (catIdx) => { if(confirm("Xóa mục này?")) { const newData = {...data}; newData.items.splice(catIdx, 1); setData(newData); } };
            const removeProduct = (catIdx, prodIdx) => { if(confirm("Xóa SP này?")) { const newData = {...data}; newData.items[catIdx].products.splice(prodIdx, 1); setData(newData); } };

            const renderEditable = (value, onChange, placeholder, className, isArea = false, style = {}) => {
                if (isPreviewMode) return <div className={`${className} whitespace-pre-wrap`} style={style}>{value}</div>;
                if (isArea) return <SmartTextarea value={value} onChange={onChange} className={`bg-sky-50/30 hover:bg-sky-50 focus:bg-white focus:ring-1 ring-sky-300 outline-none w-full transition-colors ${className}`} style={style} placeholder={placeholder} />;
                return <input value={value} onChange={onChange} className={`bg-sky-50/30 hover:bg-sky-50 focus:bg-white focus:ring-1 ring-sky-300 outline-none w-full transition-colors ${className}`} placeholder={placeholder} style={style} />;
            };

            const showHeader = data.settings?.showHeader ?? true;
            const showPrices = data.settings?.showPrices ?? true;
            const showDiscountedPrice = data.settings?.showDiscountedPrice ?? true;
            const hideDiscountedOnPrint = data.settings?.hideDiscountedOnPrint ?? true;
            const isDiscountedColVisible = showPrices && showDiscountedPrice && !(isPreviewMode && hideDiscountedOnPrint);

            const showFinancials = data.settings?.showFinancials ?? true;
            const showSignatures = data.settings?.showSignatures ?? true;
            const showDate = data.settings?.showDate ?? true;
            const showCustomerInfo = data.settings?.showCustomerInfo ?? true;
            const showGreeting = data.settings?.showGreeting ?? true;
            
            const showDiscount = data.financials?.showDiscount ?? true;
            const showInstall = data.financials?.showInstall ?? true;

            const showService1 = data.serviceInfo?.show1 ?? true;
            const showService2 = data.serviceInfo?.show2 ?? true;

            const baseHeaders = [
                {label: t.stt, cls: "w-8 md:w-10"},
                {label: t.image, cls: "w-16 md:w-24"},
                {label: t.desc, cls: "w-auto"},
                {label: t.brand, cls: "w-12 md:w-20 hidden sm:table-cell"},
                {label: t.warranty, cls: "w-8 md:w-16"},
                {label: t.qty, cls: "w-8 md:w-14"},
                {label: t.unit, cls: "w-10 md:w-16"}
            ];
            if (showPrices) {
                baseHeaders.push({label: t.price, cls: "w-20 md:w-28"});
                if (isDiscountedColVisible) {
                    baseHeaders.push({label: t.discountedPrice, cls: `w-20 md:w-28 ${hideDiscountedOnPrint ? 'print:hidden' : ''}`});
                }
                baseHeaders.push({label: t.total, cls: "w-24 md:w-28"});
            }

            const totalTableCols = 7 + (showPrices ? 2 : 0) + (isDiscountedColVisible ? 1 : 0) + (!isPreviewMode ? 1 : 0);

            return (
                <div className="min-h-screen px-2 py-4 md:p-4 pb-24 bg-gray-100">
                    
                    {/* KHỐI CSS ÉP KHỔ GIẤY IN THEO LỰA CHỌN */}
                    <style dangerouslySetInnerHTML={{__html: `
                        @media print {
                            @page { size: A4 ${appConfig.printOrientation}; margin: 0; }
                            .print-container { 
                                width: ${appConfig.printOrientation === 'landscape' ? '297mm' : '210mm'} !important; 
                                max-width: ${appConfig.printOrientation === 'landscape' ? '297mm' : '210mm'} !important; 
                            }
                        }
                    `}} />

                    <ProductManager isOpen={showProductManager} onClose={() => setShowProductManager(false)} dbProducts={dbProducts} onReload={reloadProducts} />

                    {/* BẢNG ĐIỀU KHIỂN - CONTROL PANEL */}
                    <div className="fixed-toolbar fixed top-0 left-0 right-0 bg-white shadow-lg z-50 flex flex-col border-b border-sky-200">
                        {/* Tầng 1: Công cụ hệ thống (Nền xám nhạt) */}
                        <div className="flex flex-wrap items-center justify-between p-2 bg-slate-100 border-b border-gray-200 gap-2 text-xs md:text-sm">
                            <div className="flex items-center gap-3">
                                {/* Chọn Ngôn ngữ */}
                                <div className="flex items-center gap-1 font-bold text-gray-600">
                                    🌐 Ngôn ngữ: 
                                    <select value={appConfig.lang} onChange={e => setAppConfig({...appConfig, lang: e.target.value})} className="bg-white border border-gray-300 rounded px-2 py-1 outline-none focus:border-sky-500">
                                        <option value="vi">Tiếng Việt</option>
                                        <option value="en">English</option>
                                    </select>
                                </div>

                                <div className="h-4 w-px bg-gray-300 hidden sm:block"></div>

                                    💵 Tiền tệ: 
                                    <select value={appConfig.currency} onChange={e => setAppConfig({...appConfig, currency: e.target.value})} className="bg-white border border-gray-300 rounded px-2 py-1 outline-none focus:border-sky-500">
                                        <option value="VND">VNĐ (₫)</option>
                                        <option value="USD">USD ($)</option>
                                    </select>
