                                                        </td>
                                                        <td className="px-1 pt-2 align-top w-12 md:w-20 hidden sm:table-cell">{renderEditable(p.brand, (e) => updateItem(catIdx, pIdx, 'brand', e.target.value), "", "text-center uppercase font-semibold text-[10px] md:text-[11px]")}</td>
                                                        <td className="text-center pt-2 align-top w-8 md:w-16">{renderEditable(p.warranty, (e) => updateItem(catIdx, pIdx, 'warranty', e.target.value), "", "text-center text-[10px] md:text-[11px]")}</td>
                                                        <td className="text-center pt-2 align-top w-8 md:w-14">{renderEditable(p.qty, (e) => updateItem(catIdx, pIdx, 'qty', parseInt(e.target.value)||0), "0", "text-center font-bold text-[10px] md:text-[11px]")}</td>
                                                        <td className="text-center pt-2 align-top w-10 md:w-16">{renderEditable(p.unit, (e) => updateItem(catIdx, pIdx, 'unit', e.target.value), "", "text-center text-[10px] md:text-[11px]")}</td>
                                                        
                                                        {showPrices && (
                                                            <React.Fragment>
                                                                <td className="text-right px-1 md:px-2 font-medium pt-2 align-top w-20 md:w-28 relative">
                                                                    {renderEditable(formatCurrency(p.price, !isPreviewMode), (e) => updateItem(catIdx, pIdx, 'price', parseInt(e.target.value.replace(/[^0-9]/g,''))||0), "0", "text-right text-[10px] md:text-[11px]")}
                                                                </td>
                                                                {isDiscountedColVisible && (
                                                                    <td className={`text-right px-1 md:px-2 pt-2 align-top w-20 md:w-28 bg-amber-50/40 print:bg-transparent ${hideDiscountedOnPrint ? 'print:hidden' : ''}`}>
                                                                        <div className="font-bold text-emerald-700 text-[10px] md:text-[11px]">
                                                                            {formatCurrency(discountedUnitPrice)}
                                                                        </div>
                                                                        {!isPreviewMode && itemCost > 0 && (
                                                                            <div className="text-[9px] text-amber-700 mt-0.5 ui-control" title="Giá nhập lưu trong kho để đối chiếu">
                                                                                Nhập: {formatCurrency(itemCost)}
                                                                            </div>
                                                                        )}
                                                                    </td>
                                                                )}
                                                                <td className="text-right px-1 md:px-2 font-bold text-sky-800 pt-2 align-top text-[10px] md:text-[11px] w-24 md:w-28">{formatCurrency(p.qty * p.price)}</td>
                                                            </React.Fragment>
                                                        )}

                                                        {!isPreviewMode && <td className="text-center pt-2 align-top w-8 md:w-10 delete-col bg-gray-50 border-gray-200"><button onClick={() => removeProduct(catIdx, pIdx)} className="text-red-400 hover:text-red-600 p-1 rounded transition-colors"><Icons.Trash2 size={14}/></button></td>}
                                                    </tr>
                                                    );
                                                })}
                                            </React.Fragment>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                            
                            {!isPreviewMode && <div className="ui-control mt-2 mb-6 text-center"><button onClick={addCategory} className="border border-dashed border-sky-400 text-sky-600 px-4 py-2 rounded text-xs md:text-sm hover:bg-sky-50 shadow-sm w-full md:w-auto"><Icons.Plus size={14} className="inline mr-1"/> {t.addCategory}</button></div>}
                            
                            {/* FOOTER */}
                            <div className={`flex break-inside-avoid border-t border-gray-200 ${isPreviewMode ? 'flex-row mt-4 pt-4 gap-8' : 'flex-col md:flex-row mt-4 pt-4 gap-6 md:gap-8'}`}>
                                <div className={`w-full flex text-gray-600 ${isPreviewMode ? 'w-1/2 flex-col gap-4 text-xs order-1' : 'md:w-1/2 flex-col sm:flex-row md:flex-col lg:flex-row gap-4 text-[10px] md:text-xs order-2 md:order-1 print:order-1'}`}>
                                    
                                    <div className={`flex-1 relative group rounded-lg ${isPreviewMode ? 'bg-transparent p-0' : 'bg-gray-50 md:bg-transparent p-3 md:p-0'}`}>
                                        
                                        {(showService1 || !isPreviewMode) && (
                                            <div className={`relative mb-4 ${!showService1 && !isPreviewMode ? 'opacity-40' : ''}`}>
                                                {!isPreviewMode && (
                                                    <div className="absolute right-2 md:-left-5 top-0 ui-control z-10">
                                                        <input 
                                                            type="checkbox" 
                                                            checked={showService1} 
                                                            onChange={(e) => setData({...data, serviceInfo: {...data.serviceInfo, show1: e.target.checked}})}
                                                            className="w-4 h-4 cursor-pointer accent-sky-600"
                                                            title="Hiển thị/Ẩn mục 1"
                                                        />
                                                    </div>
                                                )}
                                                <div>
                                                    {renderEditable(data.serviceInfo?.title1 !== undefined ? data.serviceInfo.title1 : "(1) Phí lắp đặt bao gồm:", (e) => setData({...data, serviceInfo: {...data.serviceInfo, title1: e.target.value}}), "Tiêu đề 1", "font-bold text-sky-700 mb-1 w-full bg-transparent")}
                                                    {renderEditable(data.serviceInfo?.desc1 !== undefined ? data.serviceInfo.desc1 : "- Thi công phần cứng toàn bộ hệ thống Smarthome.\n- Không bao gồm chi phí kéo dây điện, đục tường.", (e) => setData({...data, serviceInfo: {...data.serviceInfo, desc1: e.target.value}}), "Mô tả phí lắp đặt...", "w-full bg-transparent text-gray-600 leading-relaxed", true)}
                                                </div>
                                            </div>
                                        )}

                                        {(showService2 || !isPreviewMode) && (
                                            <div className={`relative ${!showService2 && !isPreviewMode ? 'opacity-40' : ''}`}>
                                                {!isPreviewMode && (
                                                    <div className="absolute right-2 md:-left-5 top-0 ui-control z-10">
                                                        <input 
                                                            type="checkbox" 
                                                            checked={showService2} 
                                                            onChange={(e) => setData({...data, serviceInfo: {...data.serviceInfo, show2: e.target.checked}})}
                                                            className="w-4 h-4 cursor-pointer accent-sky-600"
                                                            title="Hiển thị/Ẩn mục 2"
                                                        />
                                                    </div>
                                                )}
                                                <div>
                                                    {renderEditable(data.serviceInfo?.title2 !== undefined ? data.serviceInfo.title2 : "(2) Phí dịch vụ bao gồm:", (e) => setData({...data, serviceInfo: {...data.serviceInfo, title2: e.target.value}}), "Tiêu đề 2", "font-bold text-sky-700 mb-1 mt-2 w-full bg-transparent")}
                                                    {renderEditable(data.serviceInfo?.desc2 !== undefined ? data.serviceInfo.desc2 : "- Bảo hành tận nơi 30 ngày và bảo hành từ xa theo thời gian bảo hành sản phẩm.\n- Kết nối toàn bộ hệ thống.\n- Thiết kế hệ thống, Cấu hình tự động hóa.\n- Chia phòng, đặt tên thiết bị, cấu hình tự động.\n- Hướng dẫn khách hàng thao tác sử dụng.", (e) => setData({...data, serviceInfo: {...data.serviceInfo, desc2: e.target.value}}), "Mô tả phí dịch vụ...", "w-full bg-transparent text-gray-600 leading-relaxed", true)}
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    <div className={`flex-1 relative group rounded-lg ${isPreviewMode ? 'mt-4 bg-transparent p-0' : 'mt-4 sm:mt-0 md:mt-4 lg:mt-0 bg-gray-50 md:bg-transparent p-3 md:p-0'}`}>
                                        {!isPreviewMode && (
                                            <div className="absolute right-2 md:-left-6 top-2 md:top-0 ui-control flex items-center bg-white md:bg-transparent p-1 rounded border md:border-none shadow-sm md:shadow-none z-10">
                                                <input 
                                                    type="checkbox" 
                                                    checked={data.paymentInfo?.show ?? false} 
                                                    onChange={(e) => setData({...data, paymentInfo: {...data.paymentInfo, show: e.target.checked}})}
                                                    className="w-4 h-4 cursor-pointer accent-sky-600"
                                                    title="Hiển thị/Ẩn thông tin thanh toán"
                                                />
                                            </div>
                                        )}
                                        {((data.paymentInfo?.show) || !isPreviewMode) && (
                                            <div className={(!data.paymentInfo?.show && !isPreviewMode) ? 'opacity-40' : ''}>
                                                <h3 className={`font-bold text-sky-700 mb-1 ${isPreviewMode ? 'pr-0' : 'pr-6 md:pr-0'}`}>{t.hidePaymentMsg.includes('Hidden') ? 'PAYMENT INFORMATION:' : 'THÔNG TIN THANH TOÁN:'}</h3>
                                                <div className="space-y-1">
                                                    <p className="font-bold text-black">{renderEditable(data.paymentInfo?.title || "Tài khoản cá nhân:", (e) => setData({...data, paymentInfo: {...data.paymentInfo, title: e.target.value}}), "Tiêu đề", "font-bold text-black w-full bg-transparent")}</p>
                                                    <p>{renderEditable(data.paymentInfo?.stk || "STK: ...", (e) => setData({...data, paymentInfo: {...data.paymentInfo, stk: e.target.value}}), "Số tài khoản", "w-full bg-transparent")}</p>
                                                    <p>{renderEditable(data.paymentInfo?.ctk || "CTK: ...", (e) => setData({...data, paymentInfo: {...data.paymentInfo, ctk: e.target.value}}), "Chủ tài khoản", "w-full bg-transparent")}</p>
                                                </div>
                                                {!isPreviewMode && !data.paymentInfo?.show && <div className="text-red-500 font-medium mt-2 text-[10px] ui-control bg-red-50 p-1 rounded inline-block">{t.hidePaymentMsg}</div>}
                                            </div>
                                        )}
                                    </div>
                                </div>
                                
                                <div className={`w-full rounded-lg ${isPreviewMode ? 'w-1/2 pl-12 order-2 bg-transparent p-0' : 'md:w-1/2 md:pl-8 lg:pl-12 order-1 md:order-2 print:order-2 bg-sky-50 md:bg-transparent p-4 md:p-0 relative group'}`}>
                                    {!isPreviewMode && (
                                        <div className="absolute right-2 md:-left-6 top-2 md:top-0 ui-control flex items-center bg-white md:bg-transparent p-1 rounded border md:border-none shadow-sm md:shadow-none z-10">
                                            <input 
                                                type="checkbox" 
                                                checked={showFinancials} 
                                                onChange={(e) => setData({...data, settings: {...(data.settings || {}), showFinancials: e.target.checked}})}
                                                className="w-4 h-4 cursor-pointer accent-sky-600"
                                                title="Hiển thị/Ẩn khối Tổng Giá Trị"
                                            />
                                        </div>
                                    )}

                                    {(showFinancials || !isPreviewMode) && (
                                        <div className={!showFinancials && !isPreviewMode ? 'opacity-30' : ''}>
                                            <div className={`flex justify-between items-center border-b ${isPreviewMode ? 'py-1 border-gray-100' : 'py-1.5 md:py-1 border-sky-100 md:border-gray-100'}`}><span className={`font-bold text-gray-700 ${isPreviewMode ? 'text-base' : 'text-sm md:text-base'}`}>{t.subtotal}</span><span className={`font-bold ${isPreviewMode ? 'text-lg' : 'text-base md:text-lg'}`}>{formatCurrency(totals.subtotal)}</span></div>
                                            
                                            {(showDiscount || !isPreviewMode) && (
                                                <div className={`relative group/discount ${!showDiscount && !isPreviewMode ? 'opacity-40' : ''}`}>
                                                    {!isPreviewMode && (
                                                        <div className="absolute -left-5 top-1/2 -translate-y-1/2 ui-control z-10">
                                                            <input type="checkbox" checked={showDiscount} onChange={(e) => setData({...data, financials: {...data.financials, showDiscount: e.target.checked}})} className="w-3 h-3 cursor-pointer accent-red-500" title="Bật/Tắt dòng Chiết khấu" />
                                                        </div>
                                                    )}
                                                    <div className={`flex justify-between items-center border-b ${isPreviewMode ? 'py-1 border-gray-100 text-sm' : 'py-1.5 md:py-1 border-sky-100 md:border-gray-100 text-xs md:text-sm'}`}>
                                                        <span className="text-gray-600 flex items-center gap-2 flex-1">
                                                            {renderEditable(data.financials.discountLabel !== undefined ? data.financials.discountLabel : t.discount, (e) => setData({...data, financials: {...data.financials, discountLabel: e.target.value}}), "Nhập tên chiết khấu...", "bg-transparent text-gray-600 w-full min-w-[120px] font-medium")}
                                                            {!isPreviewMode && <button className="ui-control bg-sky-200 md:bg-gray-200 px-1.5 py-0.5 rounded hover:bg-sky-300 shadow-sm flex-shrink-0 whitespace-nowrap" onClick={() => setData({...data, financials: {...data.financials, discountType: data.financials.discountType === 'amount' ? 'percent' : 'amount'}})}><Icons.RefreshCcw size={10}/> {data.financials.discountType === 'amount' ? t.amountType : t.percentType}</button>}
                                                        </span>
                                                        <div className="flex items-center gap-1">{renderEditable(data.financials.discountType === 'amount' ? formatCurrency(data.financials.discountValue, !isPreviewMode) : data.financials.discountValue, (e) => setData({...data, financials: {...data.financials, discountValue: parseInt(e.target.value.replace(/[^0-9]/g,''))||0}}), "0", `text-right text-red-500 font-bold bg-transparent ${isPreviewMode ? 'w-24' : 'w-20 md:w-24'}`)} <span className={`font-bold w-6 ${isPreviewMode ? 'text-xs' : 'text-[10px] md:text-xs'}`}>{data.financials.discountType === 'amount' ? '' : '%'}</span></div>
                                                    </div>
                                                    {data.financials.discountType === 'percent' && <div className={`flex justify-end text-red-500 font-medium italic ${isPreviewMode ? 'text-[10px]' : 'text-[10px]'}`}>- {formatCurrency(totals.discount)}</div>}
                                                </div>
                                            )}

                                            {(showDiscount || !isPreviewMode) && (
                                                <div className={`${!showDiscount && !isPreviewMode ? 'hidden' : ''}`}>
                                                    <div className={`flex justify-between items-center border-b mt-1 ${isPreviewMode ? 'py-1 border-gray-100' : 'py-1.5 md:py-1 border-sky-100 md:border-gray-100'}`}><span className={`font-bold text-gray-700 ${isPreviewMode ? 'text-sm' : 'text-xs md:text-sm'}`}>{t.afterDiscount}</span><span className={`font-bold text-sky-800 ${isPreviewMode ? 'text-base' : 'text-sm md:text-base'}`}>{formatCurrency(totals.subtotal - totals.discount)}</span></div>
                                                </div>
                                            )}
                                            
                                            {(showInstall || !isPreviewMode) && (
                                                <div className={`relative group/install ${!showInstall && !isPreviewMode ? 'opacity-40' : ''}`}>
                                                    {!isPreviewMode && (
                                                        <div className="absolute -left-5 top-1/2 -translate-y-1/2 ui-control z-10">
                                                            <input type="checkbox" checked={showInstall} onChange={(e) => setData({...data, financials: {...data.financials, showInstall: e.target.checked}})} className="w-3 h-3 cursor-pointer accent-sky-500" title="Bật/Tắt dòng Phí lắp đặt" />
                                                        </div>
                                                    )}
                                                    <div className={`flex justify-between items-center border-b ${isPreviewMode ? 'py-1 border-gray-100 text-sm' : 'py-1.5 md:py-1 border-sky-100 md:border-gray-100 text-xs md:text-sm'}`}>
                                                        <span className="text-gray-600 flex items-center gap-2 flex-1">
                                                            {renderEditable(data.financials.installLabel !== undefined ? data.financials.installLabel : t.installFee, (e) => setData({...data, financials: {...data.financials, installLabel: e.target.value}}), "Nhập tên phí...", "bg-transparent text-gray-600 w-full min-w-[120px] font-medium")}
                                                            {!isPreviewMode && <button className="ui-control bg-sky-200 md:bg-gray-200 px-1.5 py-0.5 rounded hover:bg-sky-300 shadow-sm flex-shrink-0 whitespace-nowrap" onClick={() => setData({...data, financials: {...data.financials, installationType: data.financials.installationType === 'amount' ? 'percent' : 'amount'}})}><Icons.RefreshCcw size={10}/> {data.financials.installationType === 'amount' ? t.amountType : t.percentType}</button>}
                                                        </span>
                                                        <div className="flex items-center gap-1">{renderEditable(data.financials.installationType === 'amount' ? formatCurrency(data.financials.installationValue, !isPreviewMode) : data.financials.installationValue, (e) => setData({...data, financials: {...data.financials, installationValue: parseInt(e.target.value.replace(/[^0-9]/g,''))||0}}), "0", `text-right font-medium bg-transparent ${isPreviewMode ? 'w-24' : 'w-20 md:w-24'}`)} <span className={`text-gray-500 w-6 ${isPreviewMode ? 'text-xs' : 'text-[10px] md:text-xs'}`}>{data.financials.installationType === 'amount' ? '' : '%'}</span></div>
                                                    </div>
                                                    {data.financials.installationType === 'percent' && <div className={`flex justify-end text-gray-500 font-medium italic ${isPreviewMode ? 'text-[10px]' : 'text-[10px]'}`}>+ {formatCurrency(totals.install)}</div>}
                                                </div>
                                            )}
                                            
                                            <div className={`flex justify-between items-center bg-sky-600 text-white rounded shadow-md ${isPreviewMode ? 'py-4 mt-3 px-5' : 'py-3 md:py-4 mt-3 px-4 md:px-5'}`}><span className={`font-bold uppercase tracking-wider ${isPreviewMode ? 'text-base' : 'text-sm md:text-base'}`}>{t.grandTotal}</span><span className={`font-black ${isPreviewMode ? 'text-2xl' : 'text-xl md:text-2xl'}`}>{formatCurrency(totals.total)}</span></div>
                                            {!isPreviewMode && !showFinancials && <div className="text-red-500 font-medium mt-2 text-[10px] ui-control bg-red-50 p-1 rounded inline-block">{t.hideTotalMsg}</div>}
                                        </div>
                                    )}
                                </div>
                            </div>

                            {(showSignatures || !isPreviewMode) && (
                                <div className={`mt-10 pt-4 flex justify-between px-4 sm:px-10 md:px-20 relative group/sigs break-inside-avoid ${!showSignatures && !isPreviewMode ? 'opacity-30' : ''}`}>
                                    {!isPreviewMode && (
                                        <div className="absolute left-0 md:-left-2 top-0 ui-control z-10">
                                            <input type="checkbox" checked={showSignatures} onChange={(e) => setData({...data, settings: {...(data.settings || {}), showSignatures: e.target.checked}})} className="w-4 h-4 cursor-pointer accent-sky-600" title="Hiển thị/Ẩn Khối Chữ ký" />
                                        </div>
                                    )}
                                    <div className="text-center flex flex-col items-center w-1/2">
                                        {renderEditable(data.signatures?.partyA || "ĐẠI DIỆN KHÁCH HÀNG\n(Ký, ghi rõ họ tên)", (e) => setData({...data, signatures: {...(data.signatures || {}), partyA: e.target.value}}), "Đại diện bên A", "font-bold text-gray-800 bg-transparent text-center leading-tight text-xs md:text-sm", true)}
                                    </div>
                                    <div className="text-center flex flex-col items-center w-1/2">
                                        {renderEditable(data.signatures?.partyB || "ĐẠI DIỆN BÊN BÁN\n(Ký, ghi rõ họ tên)", (e) => setData({...data, signatures: {...(data.signatures || {}), partyB: e.target.value}}), "Đại diện bên B", "font-bold text-gray-800 bg-transparent text-center leading-tight text-xs md:text-sm", true)}
                                    </div>
                                </div>
                            )}

                            <div className="text-center text-[9px] md:text-[10px] text-gray-400 mt-12 md:mt-16 italic border-t border-gray-100 pt-3 break-inside-avoid">
                                {renderEditable(data.footerNote !== undefined ? data.footerNote : "Báo giá có giá trị 2 tuần - Otiz Smarthome", (e) => setData({...data, footerNote: e.target.value}), "Ghi chú chân trang (Xóa sạch nếu muốn ẩn)...", "text-center w-full bg-transparent")}
                            </div>

                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<QuoteTool />);
    </script>
</body>
</html>
